name: Track GitHub project updates

on:
  workflow_dispatch:
  schedule:
    # 04:00 Asia/Taipei every day.
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sync portfolio dates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Track repository update dates
        run: npm run track:github-updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK_OUTPUT_PATH: ${{ runner.temp }}/github-last-updated.json
          TRACK_MARKDOWN_PATH: ${{ runner.temp }}/github-last-updated.md

      - name: Commit synced dates
        run: |
          if git diff --quiet -- src/data/portfolio.json; then
            echo "No portfolio date changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolio.json
          git commit -m "chore: sync GitHub project update dates"
          git push
